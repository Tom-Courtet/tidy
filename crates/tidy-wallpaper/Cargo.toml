[package]
name = "tidy-wallpaper"
description = "Fonds d'écran de Tidy : bibliothèque, miniatures, playlist, pause intelligente, sources en ligne, lecteur vidéo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
tidy-core.workspace = true
uuid.workspace = true
# Miniatures et conversion des images que le système ne sait pas poser (WebP).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
# Sources en ligne (image du jour de Bing), seulement si l'utilisateur les active. TLS
# du système (schannel sous Windows, Security.framework sous macOS), comme Soundy.
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }

# Lecteur vidéo : AVPlayerLayer (décodage matériel par AVFoundation).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSURL", "NSArray", "NSValue", "NSGeometry", "NSObject", "NSError"] }
objc2-app-kit = { workspace = true, features = ["std", "NSView", "NSResponder", "objc2-quartz-core"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerLayer", "AVPlayerLooper", "AVAnimation", "AVAsset", "AVAssetImageGenerator", "objc2-quartz-core", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-core-graphics = { workspace = true, features = ["std", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }

# Lecteur vidéo : MFPlay (Media Foundation, décodage matériel DXVA) dans une fenêtre.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["std", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile.workspace = true

# `unsafe` permis dans le seul module du lecteur vidéo (`player`, voir le Cargo.toml du
# workspace), avec `// SAFETY:` à chaque bloc ; interdit partout ailleurs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
