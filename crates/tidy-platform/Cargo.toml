[package]
name = "tidy-platform"
description = "Couche système de Tidy : fenêtres du bureau, écrans, Finder, ouverture de session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
tidy-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
# Vague 1 (lot B) : icônes (NSImage → CGImage), glisser vers le Finder (NSDragging*,
# NSPasteboard), changement d'écrans (NSNotification, NSOperation).
# Vague 2 (lot F) : veille et verrouillage (NSDistributedNotificationCenter), inactivité
# (CGEventSource).
# Vague 3 (lot J) : fonds d'écran (NSColor, NSColorSpace), pause intelligente (CGWindow,
# CGSession, CFArray, CFDictionary).
objc2-app-kit = { workspace = true, features = ["std", "libc", "block2", "objc2-core-foundation", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSScreen", "NSGraphics", "NSEvent", "NSWorkspace", "NSRunningApplication", "objc2-core-graphics", "NSImage", "NSImageRep", "NSGraphicsContext", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSColor", "NSColorSpace"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFArray", "CFDictionary"] }
objc2-core-graphics = { workspace = true, features = ["std", "libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGWindowLevel", "CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGEventSource", "CGEventTypes", "CGSession", "CGWindow"] }
objc2-foundation = { workspace = true, features = ["std", "block2", "NSString", "NSDictionary", "NSValue", "NSArray", "NSEnumerator", "NSGeometry", "NSObject", "NSURL", "NSUserDefaults", "NSLocale", "NSNotification", "NSOperation", "NSDate", "NSDistributedNotificationCenter"] }
objc2-service-management = { workspace = true, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(windows)'.dependencies]
# Positions des icônes du bureau par l'API du Shell (COM : IShellWindows, IFolderView).
# Vague 1 (lot B) : icônes (IShellItemImageFactory, HBITMAP), menu contextuel du Shell
# (IContextMenu, HMENU), glisser-déposer (SHDoDragDrop, IDataObject).
# Vague 2 (lot H) : notifications (toasts WinRT : UI_Notifications, Data_Xml_Dom).
# Vague 2 (lot F) : session et veille (RemoteDesktop : WTSRegisterSessionNotification),
# inactivité (SystemInformation : GetTickCount).
# Vague 3 (lot J) : fonds d'écran (IDesktopWallpaper), pause intelligente
# (Win32_System_Power, Win32_System_StationsAndDesktops).
windows = { workspace = true, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Power", "Win32_System_StationsAndDesktops"] }

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
# Corbeille (jamais de suppression définitive). Sans les options Linux (freedesktop).
trash = { version = "5.4.0", default-features = false, features = ["coinit_apartmentthreaded"] }

[dev-dependencies]
tempfile.workspace = true

# `unsafe` autorisé ici seulement (appels Objective-C et Win32), avec `// SAFETY:`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
