[package]
name = "tidy-vault"
description = "Boîte privée de Tidy : coffre chiffré fichier par fichier (Argon2id, XChaCha20-Poly1305)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Chiffrement (RustCrypto, MIT/Apache-2.0) : dérivation de clé, chiffrement authentifié,
# effacement de la mémoire.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
# Aléa du système (même version que `uuid`).
getrandom = "0.4"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
