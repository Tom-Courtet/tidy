[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
# `unsafe` est réservé à `tidy-platform` (et au lecteur vidéo de `tidy-wallpaper`),
# qui l'autorisent eux-mêmes, avec un commentaire `// SAFETY:` à chaque bloc.
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Mêmes versions que Snappy, Tappy et Soundy : un seul jeu de crates sur la machine.
[workspace.dependencies]
tidy-core = { path = "crates/tidy-core" }
tidy-ui = { path = "crates/tidy-ui" }
tidy-platform = { path = "crates/tidy-platform" }
tidy-search = { path = "crates/tidy-search" }
tidy-vault = { path = "crates/tidy-vault" }
tidy-wallpaper = { path = "crates/tidy-wallpaper" }
tidy-widgets = { path = "crates/tidy-widgets" }
tidy-integrations = { path = "crates/tidy-integrations" }

anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.37", default-features = false }
global-hotkey = "0.10.0"
jiff = { version = "1.0.1", features = ["serde"] }
log = "0.4.35"
raw-window-handle = "0.6.2"
rfd = { version = "0.18.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std", "tracing-log"] }
tray-icon = { version = "0.26.1", default-features = false }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-service-management = { version = "0.3.2", default-features = false }
windows-sys = "0.61"
windows = { version = "0.62.2", default-features = false }
# Surveillance du dossier du bureau (agent, lot A).
notify = "9.0.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Les dépendances restent optimisées en debug, sinon `cargo run` est lent.
[profile.dev.package."*"]
opt-level = 2
